name: Deploy marketing site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; a superseded one is worth cancelling since
# it would just get immediately overwritten.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload marketing/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketing

      - id: deployment
        uses: actions/deploy-pages@v4
