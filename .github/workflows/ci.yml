name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref; a stale matrix leg proves nothing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/nativegate/pyproject.toml

      # The suite compiles real extension modules: f2py needs a Fortran
      # compiler, and the scikit-build-core path needs cmake + ninja.
      - name: Install system build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran cmake ninja-build

      # macOS runners ship gfortran with the Homebrew gcc formula; install it
      # only if it is genuinely missing so the common case stays fast.
      - name: Install system build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v gfortran >/dev/null 2>&1 || brew install gcc
          command -v cmake    >/dev/null 2>&1 || brew install cmake
          command -v ninja    >/dev/null 2>&1 || brew install ninja

      - name: Show toolchain versions
        run: |
          gfortran --version | head -1
          cmake --version | head -1
          ninja --version

      # An editable install, not a bare `pip install -r`: 15 tests in
      # tests/test_quickstart.py and tests/test_multifile_cpp.py shell out to
      # the `ngate` console script. Without the install they fail, and
      # those failures were dismissed as environmental noise for a long time.
      # They are not noise — they are the only end-to-end coverage of the CLI.
      - name: Install nativegate with extras
        working-directory: tools/nativegate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[clang,fparser,build,test]"

      - name: Verify the nativegate CLI is on PATH
        run: |
          command -v nativegate
          ngate --help >/dev/null

      # Guards a real coverage cliff: without a loadable libclang the C++
      # front end silently degrades to the regex reader (no preprocessor, no
      # templates) and the suite still goes green on far weaker parsing.
      - name: Verify the C++ AST parser backend is active
        working-directory: tools/nativegate
        run: |
          python -c '
          import sys
          from nativegate.parsers import cpp_ast
          if not cpp_ast.is_available():
              sys.exit(
                  "FAIL: cpp_ast.is_available() is False - nativegate would fall back "
                  "to the regex C++ reader (no preprocessor, no templates). Reason: "
                  + cpp_ast.unavailable_reason()
              )
          print("OK: clang AST backend is active")
          '

      # Same coverage cliff on the Fortran side. tests/test_fortran_fparser.py
      # skips wholesale when fparser is missing, so without this the suite goes
      # green with ~30 tests never run and the parse-tree backend untested.
      # A skip is not a pass.
      - name: Verify the Fortran fparser2 backend is importable
        working-directory: tools/nativegate
        run: |
          python -c '
          import sys
          try:
              import fparser
          except ImportError as exc:
              sys.exit(
                  "FAIL: fparser is not installed - every test in "
                  "tests/test_fortran_fparser.py would silently skip. Reason: "
                  + str(exc)
              )
          print("OK: fparser", fparser.__version__, "is importable")
          '

      - name: Run the test suite
        working-directory: tools/nativegate
        run: python -m pytest -q

  # Separate job, not a step: a vulnerability disclosed upstream must not turn
  # every test leg red and hide a genuine test failure behind six identical
  # audit errors. One leg, latest supported Python.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Audits the RESOLVED, hash-pinned set rather than the ranges in
      # pyproject.toml: the ranges say what is allowed, constraints.txt says
      # what is actually installed, and only the second can be vulnerable.
      - name: Audit the pinned dependency set
        working-directory: tools/nativegate
        run: pip-audit --strict --requirement constraints.txt --disable-pip

  # `docker compose up` is the primary artifact of this project: it is the
  # local dev path, the demo, and the shape the self-hosted/air-gapped
  # install has to take (docs/design-air-gapped-deployment.md §4). A compose
  # file nobody exercises rots in about a month and you find out during a
  # demo — so this job runs the real thing on every push and fails the build
  # when it stops coming up.
  #
  # Linux only: the macOS runners have no usable Docker daemon.
  compose:
    name: docker compose up
    runs-on: ubuntu-latest
    # Job-level, not per-step: every `docker compose` subcommand re-parses
    # docker-compose.yml, so a step that omits this resolves a different
    # port mapping than the one that started the container.
    env:
      CONSOLE_PORT: "8123"
    steps:
      - uses: actions/checkout@v4

      # 8000 is a popular port on hosted runners and the console's own
      # deployed project containers claim ports of their own. Pin an
      # unlikely one rather than debugging "port is already allocated" in
      # a log six months from now.
      - name: Build the console image
        run: docker compose build

      # `--wait` is the assertion, not the setup: it polls the healthcheck
      # in docker-compose.yml and exits non-zero if the container never
      # reports healthy. Without it this step would pass whenever the
      # daemon accepted the container, which is not the same as the app
      # serving requests — a stack that boots and then crashes on the
      # startup reconcile pass would go green.
      - name: Bring the stack up and wait for healthy
        run: docker compose up -d --wait --wait-timeout 180

      # The compose file spends a dozen lines explaining why this port must
      # stay on loopback: the console mounts the host Docker socket, so with
      # NGATE_AUTH=none a non-loopback binding hands anyone who can reach
      # the port root-equivalent code execution on the host. That is a
      # security invariant, which makes it a test, not a comment.
      - name: Assert the port binding is loopback-only
        run: |
          binding=$(docker compose port console 8000)
          echo "console 8000 -> $binding"
          case "$binding" in
            127.0.0.1:*) echo "OK: bound to loopback" ;;
            *) echo "FAIL: console is bound to $binding, expected 127.0.0.1:*" >&2; exit 1 ;;
          esac

      # Endpoint smoke test. /healthz alone is too weak — it is the one
      # route with no templates, no auth dependency and no router, so it can
      # return 200 while every real page 500s on a missing template or an
      # import error in a router module.
      - name: Smoke-test the console routes
        run: |
          base="http://127.0.0.1:${CONSOLE_PORT}"
          fail=0
          for path in /healthz / /projects /api/services; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "$base$path" || echo 000)
            if [ "$code" = "200" ]; then
              printf 'OK   %-16s %s\n' "$path" "$code"
            else
              printf 'FAIL %-16s %s\n' "$path" "$code" >&2
              head -c 500 /tmp/body >&2; echo >&2
              fail=1
            fi
          done
          exit "$fail"

      # Guards the exact regression the console/Dockerfile comments describe:
      # a hand-picked package list went stale and every C++/Fortran build in
      # the console failed at runtime, while the image still built cleanly.
      # The image building is not evidence that a build inside it can run.
      - name: Verify the build toolchain inside the image
        run: |
          docker compose exec -T console sh -c '
            fail=0
            for tool in ngate nativegate docker gfortran cmake g++; do
              path=$(command -v "$tool" 2>/dev/null) || { echo "FAIL: $tool missing" >&2; fail=1; continue; }
              printf "OK   %-12s %s\n" "$tool" "$path"
            done
            python -c "import pybind11, numpy" || { echo "FAIL: pybind11/numpy not importable" >&2; fail=1; }
            exit "$fail"
          '

      # Startup can log a traceback and still leave a container that answers
      # /healthz — the orchestrator reconcile pass runs in the lifespan hook
      # and a failure there is swallowed by the task, not by the process.
      - name: Check startup logs for tracebacks
        run: |
          set -o pipefail
          # Capture to a file and check it is non-empty. `logs=$(...)` in a
          # step that swallows the exit status turns "could not read logs"
          # into "found no tracebacks" — a check that passes when it cannot
          # run is worse than no check.
          docker compose logs --no-color console > /tmp/console.log
          if [ ! -s /tmp/console.log ]; then
            echo "FAIL: console produced no logs at all" >&2
            exit 1
          fi
          logs=$(cat /tmp/console.log)
          if printf '%s' "$logs" | grep -q "Traceback (most recent call last)"; then
            echo "FAIL: traceback in console startup logs" >&2
            printf '%s\n' "$logs" >&2
            exit 1
          fi
          echo "OK: no tracebacks in startup logs"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color || true

      # -v drops the console-data volume: a run that inherits a previous
      # run's SQLite file is not testing first-boot schema creation, which
      # is where the volume-permission failures actually live.
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
