name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref; a stale matrix leg proves nothing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/nativegate/pyproject.toml

      # The suite compiles real extension modules: f2py needs a Fortran
      # compiler, and the scikit-build-core path needs cmake + ninja.
      - name: Install system build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran cmake ninja-build

      # macOS runners ship gfortran with the Homebrew gcc formula; install it
      # only if it is genuinely missing so the common case stays fast.
      - name: Install system build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v gfortran >/dev/null 2>&1 || brew install gcc
          command -v cmake    >/dev/null 2>&1 || brew install cmake
          command -v ninja    >/dev/null 2>&1 || brew install ninja

      - name: Show toolchain versions
        run: |
          gfortran --version | head -1
          cmake --version | head -1
          ninja --version

      # An editable install, not a bare `pip install -r`: 15 tests in
      # tests/test_quickstart.py and tests/test_multifile_cpp.py shell out to
      # the `ngate` console script. Without the install they fail, and
      # those failures were dismissed as environmental noise for a long time.
      # They are not noise — they are the only end-to-end coverage of the CLI.
      - name: Install nativegate with extras
        working-directory: tools/nativegate
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[clang,fparser,build,test]"

      - name: Verify the nativegate CLI is on PATH
        run: |
          command -v nativegate
          ngate --help >/dev/null

      # Guards a real coverage cliff: without a loadable libclang the C++
      # front end silently degrades to the regex reader (no preprocessor, no
      # templates) and the suite still goes green on far weaker parsing.
      - name: Verify the C++ AST parser backend is active
        working-directory: tools/nativegate
        run: |
          python -c '
          import sys
          from nativegate.parsers import cpp_ast
          if not cpp_ast.is_available():
              sys.exit(
                  "FAIL: cpp_ast.is_available() is False - nativegate would fall back "
                  "to the regex C++ reader (no preprocessor, no templates). Reason: "
                  + cpp_ast.unavailable_reason()
              )
          print("OK: clang AST backend is active")
          '

      # Same coverage cliff on the Fortran side. tests/test_fortran_fparser.py
      # skips wholesale when fparser is missing, so without this the suite goes
      # green with ~30 tests never run and the parse-tree backend untested.
      # A skip is not a pass.
      - name: Verify the Fortran fparser2 backend is importable
        working-directory: tools/nativegate
        run: |
          python -c '
          import sys
          try:
              import fparser
          except ImportError as exc:
              sys.exit(
                  "FAIL: fparser is not installed - every test in "
                  "tests/test_fortran_fparser.py would silently skip. Reason: "
                  + str(exc)
              )
          print("OK: fparser", fparser.__version__, "is importable")
          '

      - name: Run the test suite
        working-directory: tools/nativegate
        run: python -m pytest -q

  # Separate job, not a step: a vulnerability disclosed upstream must not turn
  # every test leg red and hide a genuine test failure behind six identical
  # audit errors. One leg, latest supported Python.
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Audits the RESOLVED, hash-pinned set rather than the ranges in
      # pyproject.toml: the ranges say what is allowed, constraints.txt says
      # what is actually installed, and only the second can be vulnerable.
      - name: Audit the pinned dependency set
        working-directory: tools/nativegate
        run: pip-audit --strict --requirement constraints.txt --disable-pip
