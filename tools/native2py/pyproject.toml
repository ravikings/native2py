[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "native2py"
version = "0.1.0"
description = "Expose native C++/C/Fortran code to Python as deployable microservices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
# The C++ AST parser. Without it native2py falls back to the regex reader,
# which has no preprocessor and no template support (see docs/cpp-guide.md).
clang = [
    "libclang>=16",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
build = [
    "scikit-build-core>=0.10",
    "pybind11>=3.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
native2py = "native2py.cli:main"

[tool.setuptools.packages.find]
include = ["native2py*"]
